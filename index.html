<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma Lab | Entrance</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/png" href="Gemini_Generated_Image_aonol1aonol1aono.png">
    <style>
        .started-block {
            position: relative;
            z-index: 2;
        }

        h1 {
            position: relative;
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            opacity: 0;
            transform: translateY(30px);
            letter-spacing: 4px;
            background: linear-gradient(135deg, #2c3e50 0%, #1a2a3a 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(44, 62, 80, 0.1);
        }

        a {
            position: relative;
            animation: fadeInUp 1.2s 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            opacity: 0;
            transform: translateY(30px);
            overflow: hidden;
            z-index: 1;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            letter-spacing: 2px;
        }

        a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(44, 62, 80, 0.1), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        a:hover::before {
            left: 100%;
        }

        a:hover {
            transform: scale(1.05);
            background: rgba(44, 62, 80, 0.05);
            border-color: #3498db;
            color: #3498db;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.2);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Добавляем парящие частицы */
        .particle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.4), transparent);
            pointer-events: none;
            z-index: 0;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-40px) translateX(20px) scale(1.2);
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="started-block">
            <h1>PRISMA</h1>
            <a href="catalog.html">ENTER LAB</a>
        </div>
    </div>

    <script>
        (function createParticles() {
            const particleCount = 25;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 150 + 50;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 15}s`;
                particle.style.animationDuration = `${12 + Math.random() * 10}s`;
                document.body.appendChild(particle);
            }
        })();
    </script>
</body>
</html>
